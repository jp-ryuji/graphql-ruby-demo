inherit_mode:
  merge:
    - Exclude
    - Include
require:
  - rubocop-rails
AllCops:
  DisplayCopNames: true
  NewCops: enable
  Include:
    - Rakefile
    - config.ru
    - config/initializer/*
  Exclude:
    - db/**/*
    - bin/*
    - config/**/*
    - vendor/**/*
Bundler/OrderedGems:
  Exclude:
    - Gemfile
Layout/LineLength:
  Max: 150
Metrics/MethodLength:
  Max: 15
Metrics/BlockLength:
  Exclude:
    - spec/**/*_spec.rb
    - spec/factories/*
    - spec/support/*
    - Guardfile
Naming/FileName:
  Exclude:
    - Gemfile
    - Guardfile
Naming/MethodParameterName:
  MinNameLength: 2
  # AllowedNames: [ex]
Rails:
  Enabled: true
Rails/InverseOf:
  Enabled: false
Rails/HasManyOrHasOneDependent:
  Enabled: false
Style/Documentation:
  Enabled: false
